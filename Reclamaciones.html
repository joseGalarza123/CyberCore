<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyS Technologies | Libro de Reclamaciones</title>
    <link rel="stylesheet" href="../css/Reclamaciones.css">
</head>

<body>

    <header class="encabezado">
        <a class="marca" href="Inicio.html">
            <img src="../imagenes/image.png" alt="Logo de MyS Technologies">
            <span>MyS Technologies</span>
        </a>

        <nav aria-label="Navegación principal">
            <a href="Inicio.html">Inicio</a>
            <a href="Productos.html">Productos</a>
            <a href="Inicio.html#nosotros">Nosotros</a>
            <a class="activo" href="Reclamaciones.html">Libro de reclamaciones</a>
        </nav>
    </header>

    <main class="contenedor">

        <h2>Libro de Reclamaciones</h2>

        <p>
            En este formulario puedes registrar tu reclamo o queja
            relacionada con nuestros productos o servicios.
        </p>

        <form id="formReclamacion">

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>

            <label for="documento">Documento de identidad (DNI/CE):</label>
            <input type="text" id="documento" name="documento" placeholder="Ingresa tu documento" required>

            <label for="telefono">Teléfono / Celular:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 987654321" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>

            <label for="direccion">Domicilio:</label>
            <input type="text" id="direccion" name="direccion" placeholder="Ingresa tu dirección completa" required>

            <label for="tipo">Tipo de registro:</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="reclamo">Reclamo (Disconformidad con el producto)</option>
                <option value="queja">Queja (Malestar en la atención)</option>
            </select>

            <label for="producto">Producto relacionado:</label>
            <input type="text" id="producto" name="producto" placeholder="Indica el producto relacionado" required>

            <label for="detalle">Detalle del reclamo o queja:</label>
            <textarea id="detalle" name="detalle" rows="6" placeholder="Describe detalladamente tu reclamo o queja" required></textarea>

            <button type="submit">
                Registrar reclamación
            </button>

        </form>

    </main>

    <footer style="text-align: center; padding: 20px; color: #cbd5e1; font-size: 14px; margin-top: auto; border-top: 1px solid #1c2d5a;">
		<span>© 2026 MyS Technologies</span>
	</footer>

</body>

</html>
